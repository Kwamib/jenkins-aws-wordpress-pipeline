---
- name: "Delete CLiXX DB"
  hosts: localhost
  connection: local
  vars:
    instance_id: clixxdb-restored
  tasks:
    - name: Remove RDS instance without final snapshot
      amazon.aws.rds_instance:
        db_instance_identifier: "{{ instance_id }}"
        state: absent
        skip_final_snapshot: true
        region: us-east-1